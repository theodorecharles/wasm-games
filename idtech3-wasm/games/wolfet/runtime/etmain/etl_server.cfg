// ETJS dedicated match — Objective oasis, 12 slots, Omni-Bot fill
set sv_hostname "ETJS Shared Match"
set dedicated "1"
set sv_advert "0"
set sv_maxclients "13"
set sv_privateclients "0"
set sv_pure "0"
set sv_allowDownload "1"
set sv_maxRate "0"
// Supplied by server/dedicated.js from ETJS_RCON or runtime/.rcon-password.
set rconpassword ""
set g_password ""
set logfile "2"
set g_gametype "2"
set g_friendlyFire "0"
set g_heavyWeaponRestriction "100"
set g_speed "400"
set g_bluelimbotime "1000"
set g_redlimbotime "1000"
set g_forcerespawn "1"
set g_altStopwatchMode "0"
set g_doWarmup "0"
set g_warmup "5"
set match_latejoin "1"
set match_minplayers "1"
set g_inactivity "0"
set g_spectatorInactivity "0"
set omnibot_enable "1"
set omnibot_path "./legacy/omni-bot"
set omnibot_flags "0"
set com_watchdog_cmd "map oasis"
map oasis
