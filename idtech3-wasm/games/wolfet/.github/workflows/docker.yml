name: Publish Docker image

on:
  push:
    branches:
      - devel
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/master'
    # Dedicated Apple Silicon runner on the project owner's Mac mini. This
    # keeps image builds off GitHub-hosted runners; Buildx/QEMU emits amd64.
    runs-on: [self-hosted, macOS, ARM64, wolfet-wasm]
    timeout-minutes: 180
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Require Docker Hub credentials
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets, then run this workflow again."
            exit 1
          fi

      - name: Check out repository
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: actions/checkout@v7

      - name: Use Docker Desktop
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          /Applications/Docker.app/Contents/Resources/bin/docker version

      - name: Build and push amd64 image without the Mac keychain
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          case "$GITHUB_REF" in
            refs/heads/devel) etjs_image_tag="dev" ;;
            refs/heads/master) etjs_image_tag="latest" ;;
            *) echo "unsupported publish ref: $GITHUB_REF" >&2; exit 1 ;;
          esac

          etjs_action_home="$(mktemp -d)"
          export HOME="$etjs_action_home"
          etjs_docker_config="$HOME/.docker"
          etjs_docker="/Applications/Docker.app/Contents/Resources/bin/docker"
          install -d -m 0700 "$etjs_docker_config"
          printf '%s\n' \
            '{"auths":{},"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}' \
            > "$etjs_docker_config/config.json"

          "$etjs_docker" --config "$etjs_docker_config" image inspect \
            docker.io/tonistiigi/binfmt:latest >/dev/null
          "$etjs_docker" --config "$etjs_docker_config" run --privileged --rm \
            docker.io/tonistiigi/binfmt:latest --install amd64
          etjs_docker_auth="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
          jq --arg auth "$etjs_docker_auth" \
            '.auths["https://index.docker.io/v1/"] = {"auth": $auth}' \
            "$etjs_docker_config/config.json" > "$etjs_docker_config/config.next.json"
          mv "$etjs_docker_config/config.next.json" "$etjs_docker_config/config.json"
          unset etjs_docker_auth

          if "$etjs_docker" --config "$etjs_docker_config" buildx inspect wolfet-wasm >/dev/null 2>&1; then
            "$etjs_docker" --config "$etjs_docker_config" buildx use wolfet-wasm
          else
            "$etjs_docker" --config "$etjs_docker_config" buildx create \
              --name wolfet-wasm --driver docker-container --use
          fi
          "$etjs_docker" --config "$etjs_docker_config" buildx inspect --bootstrap
          "$etjs_docker" --config "$etjs_docker_config" buildx build \
            --platform linux/amd64 \
            --push \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$DOCKERHUB_USERNAME/wolfet-wasm:$etjs_image_tag" \
            .
