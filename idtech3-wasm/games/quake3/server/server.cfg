seta sv_hostname "WASM Quake III Arena"
seta g_motd "Eight-player rotating arena"
seta sv_maxclients 9
seta sv_pure 0
seta bot_enable 1
seta bot_minplayers 8
seta g_gametype 0
seta timelimit 12
seta fraglimit 25
seta g_weaponrespawn 3
seta g_inactivity 300
seta g_forcerespawn 10
set d1 "map q3dm6 ; set nextmap vstr d2"
set d2 "map q3dm7 ; set nextmap vstr d3"
set d3 "map q3dm11 ; set nextmap vstr d4"
set d4 "map q3dm17 ; set nextmap vstr d1"
