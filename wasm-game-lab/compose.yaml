name: wasm-game-lab

# Private loopback-only portfolio launcher. Every game service is a canonical
# family/locked framework image and receives persistent storage at /data.
# Each exact framework release is recorded in image-contracts.json.
x-game: &game
  restart: unless-stopped
  pull_policy: never

services:
  portal:
    image: nginx:1.27-alpine
    container_name: wasm-game-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/site:ro

  blood:
    <<: *game
    image: ${BLOOD_IMAGE:-blood-wasm:dev}
    container_name: wasm-blood
    ports:
      - "127.0.0.1:8007:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/blood:/data

  duke3d:
    <<: *game
    image: ${DUKE3D_IMAGE:-duke3d-wasm:dev}
    container_name: wasm-duke3d
    ports:
      - "127.0.0.1:18007:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/duke3d:/data

  idtech1:
    <<: *game
    image: ${IDTECH1_IMAGE:-idtech1-wasm:dev}
    container_name: wasm-idtech1
    ports:
      - "127.0.0.1:8010:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/crispy:/data

  wolf3d:
    <<: *game
    image: ${WOLF3D_IMAGE:-wolf3d-wasm:dev}
    container_name: wasm-wolf3d
    ports:
      - "127.0.0.1:8011:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/wolf3d:/data/wolf3d

  spear:
    <<: *game
    image: ${SPEAR_IMAGE:-spear-wasm:dev}
    container_name: wasm-spear
    ports:
      - "127.0.0.1:8012:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/wolf3d:/data/wolf3d

  cod2:
    <<: *game
    image: ${COD2_IMAGE:-local/cod2-wasm:cod2-mp-dev}
    container_name: wasm-cod2
    ports:
      - "127.0.0.1:8014:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/cod2:/data

  dosbox:
    <<: *game
    image: ${DOSBOX_IMAGE:-dosbox-wasm:dev}
    container_name: wasm-dosbox-suite
    ports:
      - "127.0.0.1:8016:8088"
    volumes: &dosbox-data
      - ${WASM_DATA_ROOT:-../data}/dosbox:/data

  jazz:
    <<: *game
    image: ${JAZZ_IMAGE:-jazz-wasm:dev}
    container_name: wasm-jazz
    ports:
      - "127.0.0.1:8020:8088"
    volumes: *dosbox-data

  duke1:
    <<: *game
    image: ${DUKE1_IMAGE:-duke1-wasm:dev}
    container_name: wasm-duke1
    ports:
      - "127.0.0.1:8021:8088"
    volumes: *dosbox-data

  duke2:
    <<: *game
    image: ${DUKE2_IMAGE:-duke2-wasm:dev}
    container_name: wasm-duke2
    ports:
      - "127.0.0.1:8022:8088"
    volumes: *dosbox-data

  gta:
    <<: *game
    image: ${GTA_IMAGE:-gta1-wasm:dev}
    container_name: wasm-gta-dos-demo
    ports:
      - "127.0.0.1:8023:8088"
    volumes: *dosbox-data

  nfs:
    <<: *game
    image: ${NFS_IMAGE:-nfs1-wasm:dev}
    container_name: wasm-nfs-dos
    ports:
      - "127.0.0.1:8024:8088"
    volumes: *dosbox-data

  simcity2000:
    <<: *game
    image: ${SIMCITY2000_IMAGE:-simcity2000-wasm:dev}
    container_name: wasm-simcity2000
    ports:
      - "127.0.0.1:8025:8088"
    volumes: *dosbox-data

  openrct2:
    <<: *game
    image: ${OPENRCT2_IMAGE:-openrct2-wasm:dev}
    container_name: wasm-openrct2
    ports:
      - "127.0.0.1:8026:8088"
    volumes:
      - openrct2-data:/data

  goldsource:
    <<: *game
    image: ${GOLDSOURCE_IMAGE:-goldsource-wasm:dev}
    container_name: wasm-goldsource-suite
    ports:
      - "127.0.0.1:8017:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/goldsource:/data

  source:
    <<: *game
    image: ${SOURCE_IMAGE:-local/source-wasm:hl2-dev}
    container_name: wasm-source-hl2
    ports:
      - "127.0.0.1:8019:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/source:/data

  quake1:
    <<: *game
    image: ${QUAKE1_IMAGE:-quake1-wasm:dev}
    container_name: wasm-quake1
    ports:
      - "127.0.0.1:8081:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/quake1:/data

  quake2:
    <<: *game
    image: ${QUAKE2_IMAGE:-quake2-wasm:dev}
    container_name: wasm-quake2
    ports:
      - "127.0.0.1:8082:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/quake2:/data

  quake3:
    <<: *game
    image: ${QUAKE3_IMAGE:-idtech3-quake3-wasm:devel}
    container_name: wasm-quake3
    ports:
      - "127.0.0.1:8083:8088"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/quake3:/data

  quake4:
    <<: *game
    image: ${QUAKE4_IMAGE:-local/idtech4-wasm:quake4-dev}
    container_name: wasm-quake4
    ports:
      - "127.0.0.1:8084:8088"
    volumes: &idtech4-data
      - ${WASM_DATA_ROOT:-../data}/doom3/base:/data/base
      - ${WASM_DATA_ROOT:-../data}/doom3/d3xp:/data/d3xp
      - ${WASM_DATA_ROOT:-../data}/quake4/q4base:/data/q4base
      - ${WASM_DATA_ROOT:-../data}/prey/base:/data/prey/base

  quake4-mp:
    <<: *game
    image: ${QUAKE4_MP_IMAGE:-local/idtech4-wasm:quake4-mp-dev}
    container_name: wasm-quake4-mp
    ports:
      - "127.0.0.1:18084:8088"
    volumes: *idtech4-data

  rtcw-sp:
    <<: *game
    image: ${RTCW_SP_IMAGE:-idtech3-rtcw-sp-wasm:devel}
    container_name: wasm-rtcw-sp
    ports:
      - "127.0.0.1:8085:8088"
    volumes: &rtcw-data
      - ${WASM_DATA_ROOT:-../data}/rtcw:/data

  rtcw-mp:
    <<: *game
    image: ${RTCW_MP_IMAGE:-idtech3-rtcw-mp-wasm:devel}
    container_name: wasm-rtcw-mp
    ports:
      - "127.0.0.1:18085:8088"
    volumes: *rtcw-data

  doom3:
    <<: *game
    image: ${DOOM3_IMAGE:-local/idtech4-wasm:doom3-dev}
    container_name: wasm-doom3
    ports:
      - "127.0.0.1:8086:8088"
    volumes: *idtech4-data

  doom3-mp:
    <<: *game
    image: ${DOOM3_MP_IMAGE:-local/idtech4-wasm:doom3-mp-dev}
    container_name: wasm-doom3-mp
    ports:
      - "127.0.0.1:18086:8088"
    volumes: *idtech4-data

  roe:
    <<: *game
    image: ${ROE_IMAGE:-local/idtech4-wasm:roe-dev}
    container_name: wasm-roe
    ports:
      - "127.0.0.1:18087:8088"
    volumes: *idtech4-data

  prey:
    <<: *game
    image: ${PREY_IMAGE:-local/idtech4-wasm:prey-dev}
    container_name: wasm-prey-2006
    ports:
      - "127.0.0.1:8087:8088"
    volumes: *idtech4-data

  wolfet:
    <<: *game
    image: ${WOLFET_IMAGE:-docker.io/tedcharles/wolfet-wasm@sha256:782b71fbf80cf5a2b6c0987c28e1d010355d66bb8f4c5be360cd187761fca760}
    container_name: wasm-wolfet
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:27960:27960/udp"
    volumes:
      - ${WASM_DATA_ROOT:-../data}/wolfet:/data

volumes:
  openrct2-data:
    external: true
    name: ${OPENRCT2_DATA_VOLUME:-openrct2-data}
